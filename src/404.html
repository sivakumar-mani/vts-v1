<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Untitled Document</title>
<style>
.error-box {
    min-height: calc(100vh - 0px);
    height: 100%;
    width: 100%;
    font-family: Roboto, Helvetica Neue, sans-serif;
}
.error-body {
    text-align: center;
}
.error-body h1 {
    color: #eda29b;
    font-size: 210px;
    font-weight: 900;
    line-height: 210px;
    margin: 50px 0;
    transform: skewY(12deg);
}
.error-body p {
    color: #acacae;
    margin: 15px 0 60px;
}
.error-body h3 {
    line-height: 30px;
    font-size: 21px;
    text-transform: uppercase;
    color: #b7c8d5;
    margin: 10px 0;
    font-weight: 300;
}
.error-body a {
    background: #f9be00;
    color: #353535;
    text-decoration: none;
    padding: 10px 30px;
    border-radius: 4px;
}
</style>
</head>
<body>
<div class="error-box">
  <div class="error-body">
    <h1>404</h1>
    <h3>Page Not Found !</h3>
    <p>Oops... you may have mistyped the address or the page may have moved.</p>
    <a href="#">Back to home</a> </div>
</div>
</body>
</html>

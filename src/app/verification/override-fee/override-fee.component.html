<form [formGroup]="overrideForm">
  <div fxLayout="row wrap" fxLayout.lg="row" fxLayout.md="row" fxLayout.sm="column" fxLayout.xs="column">
    <div fxFlex="100%" fxFlex.lg="100%" fxFlex.md="100%" fxFlex.sm="100%" fxFlex.xs="100%">
      <!-- <h3 class="sub-header">Override Fee -->
      <span fxFlex></span>
      <button mat-icon-button class="in-btn mb-10" matTooltip="Save" (click)="saveOverrideFee()"
        matTooltipClass="accent-tooltip"> <i class="icon-save"></i>
      </button>
      <!-- </h3> -->
    </div>
  </div>
  <div fxLayout="row wrap" fxLayout.lg="row" fxLayout.md="row" fxLayout.sm="column" fxLayout.xs="column"
    fxLayoutGap="20px grid" fxLayoutGap.sm="0px grid" fxLayoutGap.xs="0px grid">
    <div fxFlex="100%" fxFlex.lg="100%" fxFlex.md="100%" fxFlex.sm="100%" fxFlex.xs="100%" fxLayoutGap="20px">
      <div fxFlex="17%">
        <mat-label class="lbl">Is Fee Manual</mat-label>
        <mat-checkbox formControlName="feeFlag"> Is Fee Manual</mat-checkbox>
      </div>
      <div fxFlex="30%">
        <mat-form-field appearance="outline">
          <mat-label>Fee Value</mat-label>
          <input matInput formControlName="feeCharge" placeholder="Fee Value" maxlength="7" preventDragdrop
            preventCutCopyPaste appNumberOnly [NumberOnlyWithDot]="false">
        </mat-form-field>
      </div>
      <div fxFlex="20%">
        <mat-label class="lbl">Is Calling Manual</mat-label>
        <mat-checkbox formControlName="callFlag">Is Calling Manual</mat-checkbox>
      </div>
      <div fxFlex="30%">
        <mat-form-field appearance="outline">
          <mat-label> Calling Value</mat-label>
          <input matInput formControlName="callCharge" placeholder="Calling Value" maxlength="7" preventDragdrop
            preventCutCopyPaste appNumberOnly [NumberOnlyWithDot]="false">
        </mat-form-field>
      </div>
    </div>
  </div>
</form>

<app-breadcrumb [btnAdd]="breadcrumbFlag.btnAdd" [btnSave]="breadcrumbFlag.btnSave"
  [btnSaveDisabled]="breadcrumbFlag.btnSaveDisabled" [btnBack]="breadcrumbFlag.btnBack"
  [btnReset]="breadcrumbFlag.btnReset" [btnResetTbl]="breadcrumbFlag.btnResetTbl" (eventAdd)="openBillingCycle()"
  [routePath]="routePath" [btnAddDisabled]="!screenAuth.addFlag" (eventBack)="closeBillingCycle()"
  (eventSave)="saveBillingCycleDetail()" [toolTip]="breadcrumbFlag.toolTip" (eventReset)="resetForm()"
  (eventResetTbl)="resetTable()"></app-breadcrumb>
<div fxLayout="row">
  <div fxFlex="100%">
    <mat-card>

      <div fxLayout="row">
        <mat-card-header fxFlex="100%">
            <div fxFlex="100%">
                <div fxLayout="row" fxLayout.lg="row" fxLayout.md="row" fxLayout.sm="row" fxLayout.xs="column" fxLayoutGap="10px">
                      <div fxFlex="70%" fxFlex.lg="70%" fxFlex.md="70%" fxFlex.sm="70%" fxFlex.xs="100%" fxLayoutAlign="start center" fxLayoutAlign.sm="start center" fxLayoutAlign.xs="start center">
                        <mat-card-title>
                          <h1 class="header-title">Billing Cycle</h1>
                        </mat-card-title>
                      </div>
                      <span fxFlex></span>
                      <div fxFlex="30%" fxFlex.lg="30%" fxFlex.md="30%" fxFlex.sm="30%" fxFlex.xs="100%" fxHide.xs fxLayoutAlign="end center" fxLayoutAlign.sm="end center">
                        <div class="tbl-commonsearch" *ngIf="!showBillingCycle">
                            <mat-form-field fxFlex="100%">
                            <mat-label></mat-label>
                            <mat-icon matPrefix><i class="icon-search1"></i></mat-icon>
                            <input #global matInput size="50" placeholder="Search..." autocomplete="off" (input)="dt?.filterGlobal($event.target.value, 'contains')" (keypress)="dt.reset();dt?.filterGlobal($event.target.value, 'contains');lookupNameControl.reset();" />
                            </mat-form-field>
                        </div>
                      </div>
                </div>
            </div>
        </mat-card-header>
    </div> 
 
      <mat-card-content>
        <div *ngIf="showBillingCycle" fxLayout="row">
          <form [formGroup]="BillingCycleForm" autocomplete="off" id="ngForm" autocomplete="off" fxFlex="100%">
            <div fxLayout="row wrap" fxLayout.lg="row" fxLayout.md="row" fxLayout.sm="row wrap" fxLayout.xs="column" fxLayoutGap="20px grid" fxLayoutGap.xs="0px grid">
                  <div fxFlex="33.33%" fxFlex.lg="33.33%" fxFlex.md="33.33%" fxFlex.sm="50%" fxFlex.xs="100%">
                    <mat-form-field appearance="outline" fxFlex="100%" floatLabel="always">
                      <mat-label> Billing Cycle Name</mat-label>
                      <input maxlength="75" matInput placeholder="Billing Cycle Name" formControlName="lookupName" />
                      <mat-error *ngIf="BillingCycleForm.get('lookupName').invalid">
                        Billing cycle name is required
                      </mat-error>
                    </mat-form-field>
                  </div>
                  <div fxFlex="44.33%" fxFlex.lg="44.33%" fxFlex.md="44.33%" fxFlex.sm="30%" fxFlex.xs="100%">
                    <mat-label class="lbl">Is Active</mat-label>
                    <mat-checkbox formControlName="active">Active</mat-checkbox>
                  </div>
            </div>
          </form>
        </div>
        <div fxLayout="row" *ngIf="!showBillingCycle">
          <div fxFlex="100%">
          <p-table
  #dt
  [columns]="displayedColumns"
  (onRowReorder)="onRowReorder($event)"
  [value]="billingCycleList"
  [scrollable]="true"
  scrollHeight=""
  [rows]="200"
  [resizableColumns]="true"
  [reorderableColumns]="true"
  [paginator]="true">

  <!-- ========== COLGROUP ========== -->
  <ng-template pTemplate="colgroup" let-colGroupCols>
    <colgroup>
      <col *ngFor="let col of colGroupCols" style="min-width:150px" />
    </colgroup>
  </ng-template>

  <!-- ========== HEADER ========== -->
  <ng-template pTemplate="header" let-headerCols>
    <tr>
      <th style="width:70px">#order</th>
      <th style="width:100px">Actions</th>

      <th *ngFor="let col of headerCols"
          [ngSwitch]="col.field"
          pReorderableColumn
          pResizableColumn
          [ngClass]="{ 'text-center action': col.field === 'Actions' }">

        <span [pSortableColumn]="col.field">
          <div class="thname">{{ col.header }}</div>
          <p-sortIcon
            *ngIf="col.field !== 'Actions'"
            ariaLabel="Activate to sort"
            ariaLabelDesc="Activate to sort in descending order"
            matTooltip="Sorting"
            matTooltipClass="accent-tooltip"
            ariaLabelAsc="Activate to sort in ascending order">
          </p-sortIcon>
        </span>

        <!-- ðŸ” SEARCH UI unchanged -->
      </th>
    </tr>
  </ng-template>

  <!-- ========== BODY ========== -->
  <ng-template
    pTemplate="body"
    let-rowData
    let-index="rowIndex"
    let-bodyCols="columns">

    <tr [pReorderableRow]="index">

      <td style="width:70px">
        <i class="icon-menu"
           matTooltip="Re-order"
           matTooltipClass="accent-tooltip"
           pReorderableRowHandle></i>
      </td>

      <td class="desg-bg" style="width:100px">
        <div fxLayout="row" class="tbl-icon">
          <div fxFlex="100%" fxLayoutGap="10px">
            <mat-icon [ngClass]="screenAuth.editFlag === false ? 'page-btn disabled' : ''">
              <i matTooltip="Edit"
                 matTooltipClass="accent-tooltip"
                 class="material-icons-outlined"
                 (click)="editBillingCycleDetail(rowData)">edit</i>
            </mat-icon>
            <mat-icon [ngClass]="screenAuth.deleteFlag === false ? 'page-btn disabled' : ''">
              <i matTooltip="Delete"
                 matTooltipClass="accent-tooltip"
                 class="material-icons-outlined"
                 (click)="openDialog(rowData)">delete</i>
            </mat-icon>
          </div>
        </div>
      </td>

      <td *ngFor="let col of bodyCols"
          [ngSwitch]="col.field"
          matTooltip="Client is allotted for the Billing Cycle"
          matTooltipClass="accent-tooltip"
          [matTooltipDisabled]="rowData['disable'] === false">

        <div *ngSwitchCase="'lookupName'">{{ rowData.lookupName }}</div>

        <div *ngSwitchCase="'active'">
          <div fxLayout="row" class="tbl-icon">
            <span *ngIf="rowData.active" class="istrue">
              <i class="material-icons" matTooltip="Active">thumb_up</i>
            </span>
            <span *ngIf="!rowData.active" class="isfalse">
              <i class="material-icons" matTooltip="In-Active">thumb_down</i>
            </span>
          </div>
        </div>

      </td>
    </tr>
  </ng-template>

  <!-- ========== EMPTY MESSAGE ========== -->
  <ng-template pTemplate="emptymessage" let-emptyCols>
    <tr>
      <td colspan="4">
        <div class="no-record text-center">
          <!-- No Record Found -->
        </div>
      </td>
    </tr>
  </ng-template>

</p-table>
            <div fxLayout="row" [ngClass]="{ 'empty-record': billingCycleList.length == 0 }"></div>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
<div>
  <p-toast position="top-center" key="warning" class="warning-alert"> </p-toast>
</div>
<ng-template #updateConfirmation>
 
    
    <mat-dialog-content>
      <div fxLayout="row">
        <div fxFlex="100%">
          <div fxLayout="row">
            <div fxFlex="100%" fxLayoutAlign="center center" class="mb-15"> <img src="assets/images/alert-success.gif"> </div>
          </div>
          <div fxLayout="row" fxLayoutAlign="center center">
            <div fxFlex="100%" class="text-center">
              <h3 class="m-0">Confirmation !</h3>
              <p class="text-sm">Do you want to <b>save</b> re-ordered records?</p>
            </div>
          </div>
        </div>
      </div>
    
    </mat-dialog-content>
    <mat-dialog-actions fxLayoutAlign="end center" fxLayoutGap="8px">
      <button mat-stroked-button (click)="dialogClose()">No, Keep it</button>
      <button mat-flat-button color="warn" (click)="onClickUpdateOk()">
        Yes, Update it
      </button>
    </mat-dialog-actions>
 
</ng-template>

<div fxLayout="column"  class="DeptChBg">
  <div fxFlex="100%" class="chHead">
    <h2 class="ht">Choose Department</h2>
    <p class="ht">Kindly select your department to do your activities</p>
  </div>
  <div fxFlex="100%">

    <div fxLayout="row wrap" fxLayout.md="row" fxLayout.sm="row" fxLayout.xs="column" fxLayoutAlign="center center">
      <div fxFlex="100%"  fxFlex.lg="100%" fxFlex.md="100%" fxFlex.sm="100%" fxFlex.xs="100%">

        <mat-radio-group [formControl]="userDepartment" fxLayoutGap="20px" class="OptSel">



          @for (res of this.userData.userDepartmentVm; track res) {
            <mat-radio-button class="select_btn" [value]="res.departmentId">
              {{res.departmentName}}<span class="info-text"></span></mat-radio-button>
            }


          </mat-radio-group>

        </div>
      </div>
      <div class="clearfix">&nbsp;</div>
      <div class="btns" fxLayout="row wrap" fxLayout.md="row" fxLayout.sm="row" fxLayout.xs="row" fxLayoutGap="0px grid"
        fxLayoutAlign="center center">
        <div fxLayoutGap="10px" style="margin: 0px 50px 0px 50px;">
          <button mat-flat-button color="primary" (click)="openDashboard()">Proceed</button>
          <button mat-stroked-button (click)="logout()">{{this.auth.dashboardFlag === true ? 'Cancel' : 'Logout'}}</button>
        </div>
      </div>
    </div>
  </div>
  <div class="clearfix">&nbsp;</div>

<app-breadcrumb [btnReset]="false" [routePath]="routePath" [btnExcelExport]="true" (eventReset)="resetForm()"
(eventExcelExport)="exportExcel()"></app-breadcrumb>
<div fxLayout="row" class="advSearch" [formGroup]="employmentReportForm" autocomplete="off">
  <div class="advSearch-forms">
    <div fxLayout="row" fxLayoutGap="20px">
      <div fxFlex="100%">
        <div fxLayout="row" fxLayoutGap="20px">
          <div fxFlex="200px">
            <app-auto-complete (propValueEvent)="getPropertyValue($event)" [selectProperties]='clientNameControl'>
            </app-auto-complete>
          </div>
          <div fxFlex="200px" fxLayoutGap="10px">
            <mat-form-field fxFlex="100%">
              <mat-label>From Date</mat-label>
              <input matInput [matDatepicker]="sampledatePicker" placeholder="From Date" formControlName="fromdate"
                (focus)="sampledatePicker.open()" (click)="sampledatePicker.open()"/>
              <mat-datepicker-toggle matSuffix [for]="sampledatePicker"></mat-datepicker-toggle>
              <mat-datepicker #sampledatePicker></mat-datepicker>
            </mat-form-field>
            <!-- <mat-form-field fxFlex="100%">
            <mat-label>From Date & Time</mat-label>
            <input matInput formControlName="fromDate" placeholder="From Date" [owlDateTimeTrigger]="from"
              [owlDateTime]="from">
            <mat-datepicker-toggle [owlDateTimeTrigger]="from" matSuffix></mat-datepicker-toggle>
            <owl-date-time [pickerMode]="'popup'" #from></owl-date-time>
          </mat-form-field> -->
        </div>
        <div fxFlex="200px">
          <mat-form-field fxFlex="100%">
            <mat-label>To Date</mat-label>
            <input matInput [matDatepicker]="sampledatePicker1" placeholder="To Date" formControlName="todate"
              (focus)="sampledatePicker1.open()" (click)="sampledatePicker1.open()"/>
            <mat-datepicker-toggle matSuffix [for]="sampledatePicker1"></mat-datepicker-toggle>
            <mat-datepicker #sampledatePicker1></mat-datepicker>
          </mat-form-field>
          <!-- <mat-form-field fxFlex="100%">
          <mat-label>To Date & Time</mat-label>
          <input matInput formControlName="toDate" placeholder="To Date" [owlDateTimeTrigger]="to"
            [owlDateTime]="to">
          <mat-datepicker-toggle [owlDateTimeTrigger]="to" matSuffix></mat-datepicker-toggle>
          <owl-date-time [pickerMode]="'popup'" #to></owl-date-time>
        </mat-form-field> -->
      </div>
      <div fxFlex="100px">
        <mat-label class="lbl">120 Days</mat-label>
        <mat-checkbox (change)='monthlyChange($event.checked)' formControlName="monthly"></mat-checkbox>
      </div>
    </div>
  </div>
</div>
</div>
<div fxFlex="100%" class="advSearch-btn">
  <div class="FloatR mt-15" fxLayoutAlign="start center" fxLayoutGap="10px">
    <a (click)="searchValue()">Search</a><span>|</span>
    <a routerLink="/dashboard/reports/employeementReport" (click)="resetForm()"> Reset</a><span>|</span>
    <a (click)='SearchCriFilter = !SearchCriFilter'>
      {{ SearchCriFilter?'Show Less':'Show More'}}&nbsp;<i
    class="icon-chevron-{{ SearchCriFilter?'up':'down' }}"></i></a> </div>
  </div>
  @if (SearchCriFilter) {
    <div fxLayout="row" class="advSearchshow">
      <div class="advSearch-forms">
        <div fxLayout="row wrap" fxLayoutGap="20px grid">
          <div fxFlex="100%">
            <div fxLayout="row" fxLayoutGap="20px" [formGroup]="employmentReportForm">
              <div fxFlex="200px">
                <app-auto-complete (propValueEvent)="getPropertyValue($event)" [selectProperties]='statusControl'>
                </app-auto-complete>
              </div>
              <div fxFlex="200px">
                <app-auto-complete (propValueEvent)="getPropertyValue($event)" [selectProperties]='componentControl'>
                </app-auto-complete>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div fxFlex="100%" class="advSearch-btn">
        <div class="FloatR" fxLayoutAlign="start center">&nbsp;</div>
      </div>
    </div>
  }
</div>

<div fxLayout="row" class="srchPad">
  <div fxFlex="100%">
    <mat-card>
      <mat-card-header>
        <div fxFlex="100%">
          <mat-card-title>
            <div fxLayout="row">
              <div fxFlex="100%">
                <div fxLayout="row wrap" fxLayout.lg="row" fxLayout.md="row" fxLayout.sm="row" fxLayout.xs="column"
                  fxLayoutGap="10px grid">
                  <div fxFlex="70%" fxFlex.lg="70%" fxFlex.md="70%" fxFlex.sm="80%" fxFlex.xs="100%"
                    fxLayoutAlign="start center" fxLayoutAlign.sm="start center" fxLayoutAlign.xs="start center">
                    <h1 class="header-title">Employment Report Form</h1>
                  </div>
                  <span fxFlex></span>
                  <div fxFlex="30%" fxFlex.lg="30%" fxFlex.md="30%" fxFlex.sm="30%" fxFlex.xs="100%" fxHide.xs
                    fxLayoutAlign="end center" fxLayoutAlign.sm="end center">
                    <mat-form-field fxFlex="100%">
                      <mat-label></mat-label>
                      <mat-icon matPrefix><i class="icon-search1"></i></mat-icon>
                      <input matInput class="form-control" placeholder="Search here..." [(ngModel)]="searchText">
                    </mat-form-field>
                  </div>
                </div>
              </div>
            </div>
          </mat-card-title>

        </div>
      </mat-card-header>
      <mat-card-content>
        <div fxLayout="row wrap" fxLayout.lg="row" fxLayout.md="row" fxLayout.sm="column" fxLayout.xs="column"
          fxLayoutGap="20px grid">
          <div fxFlex="100%">
            <div fxLayout="row wrap" fxLayoutGap="20px grid">
              <kendo-grid [kendoGridBinding]="employmentReportList | filter:searchText" [reorderable]="true"
                [pageable]="true" [sortable]="true" [groupable]="true" [pageSize]="10"
                style="width: 100%; min-height: 10px;" [columnMenu]="{ filter: true }">
                @for (report of displayColumns; track report) {
                  <kendo-grid-column [field]="report.field" [title]="report.header" [width]="180"
                    [headerStyle]="{'background-color': '#58595C','color': '#fff','line-height': '2em'}"
                    [style]="{'background-color': '#ffffff','color': '#333333'}">
                    <ng-template kendoGridCellTemplate let-dataItem>
                    {{ dataItem[report.field] ? dataItem[report.field] : 'N/A' }}                    </ng-template>
                  </kendo-grid-column>
                }
                <kendo-grid-messages noRecords="No Data Found">
                </kendo-grid-messages>
              </kendo-grid>
              <!-- <pre>{{employmentReportList |json}} </pre> -->
            </div>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
